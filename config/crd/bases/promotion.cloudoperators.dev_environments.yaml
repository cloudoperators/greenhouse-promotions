---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: environments.promotion.cloudoperators.dev
spec:
  group: promotion.cloudoperators.dev
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.currentRevision.name
      name: Current
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Verified')].status
      name: Verified
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Environment
            properties:
              clusterSelector:
                description: |-
                  clusterSelector selects the Greenhouse Clusters that form this Environment's
                  slice of the fleet. A plain label selector; matching is by label, never by name.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              gate:
                description: gate is the health gate that decides when the current
                  Revision is Verified.
                properties:
                  autoPromote:
                    default: true
                    description: |-
                      autoPromote, when false, holds before opening a Promotion until a human
                      approves (annotation); the gate still runs after the move is applied.
                    type: boolean
                  soak:
                    description: |-
                      soak is how long the cohort must stay continuously healthy after converging
                      before the Revision is marked Verified. A Go duration (e.g. "30m", "2h").
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                required:
                - soak
                type: object
              maxHistory:
                default: 10
                description: maxHistory is how many rollout history entries to retain
                  (newest-first).
                format: int32
                minimum: 0
                type: integer
              source:
                description: |-
                  source selects which Revision this Environment should run. Exactly one of the
                  nested fields must be set (one-of): newestFromSource (head of chain) or
                  verifiedIn (downstream, gated behind an upstream Environment).
                maxProperties: 1
                minProperties: 1
                properties:
                  newestFromSource:
                    description: |-
                      newestFromSource tracks the Source directly: the Environment is a head of the
                      chain and takes each version the Source freezes, in turn. Empty struct toggle.
                    type: object
                  verifiedIn:
                    description: |-
                      verifiedIn gates this Environment behind an upstream Environment: it only runs
                      a Revision once that upstream has marked it Verified. A single reference.
                    properties:
                      name:
                        description: name of the referenced Environment.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              sourceRef:
                description: sourceRef points to the Source whose definition this
                  Environment rolls out.
                properties:
                  name:
                    description: name of the referenced Source.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - clusterSelector
            - gate
            - source
            - sourceRef
            type: object
          status:
            description: status defines the observed state of Environment
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Environment resource.
                  Known types:
                  - "Ready": the target cohort has converged onto currentRevision
                  - "Healthy": the current cohort health (True/False/Unknown is the health signal)
                  - "Verified": the gate passed for currentRevision; verifiedRevision is set and a
                    downstream Environment may take it via verifiedIn

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentRevision:
                description: currentRevision references the Revision this Environment
                  is currently on.
                properties:
                  name:
                    description: name of the referenced Revision.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              history:
                description: history is the rollout history, newest-first, trimmed
                  to spec.maxHistory.
                items:
                  description: HistoryEntry is one rollout record.
                  properties:
                    enteredAt:
                      description: enteredAt is when this Revision became the target.
                      format: date-time
                      type: string
                    promotion:
                      description: promotion references the Promotion that executed
                        the move.
                      properties:
                        name:
                          description: name of the referenced Promotion.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    result:
                      description: result is the outcome of this rollout.
                      enum:
                      - Verified
                      - Superseded
                      - Failed
                      type: string
                    revision:
                      description: revision references the Revision for this rollout.
                      properties:
                        name:
                          description: name of the referenced Revision.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    verifiedAt:
                      description: verifiedAt is when the gate passed for this Revision,
                        if it did.
                      format: date-time
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: observedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
              targets:
                description: targets summarizes the Promotions this Environment owns
                  and how many are ready.
                properties:
                  ready:
                    description: ready is how many of those Promotions report Ready=True.
                    format: int32
                    type: integer
                  total:
                    description: total is the number of Promotions this Environment
                      owns.
                    format: int32
                    type: integer
                type: object
              verifiedRevision:
                description: |-
                  verifiedRevision references the Revision this Environment has verified through its
                  gate. It is set only once the Verified condition becomes True for that Revision,
                  and is the machine-readable signal a downstream Environment reads via verifiedIn.
                properties:
                  name:
                    description: name of the referenced Revision.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
