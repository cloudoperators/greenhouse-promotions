---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - greenhouse.sap
  resources:
  - clusters
  - plugins
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - environments
  - revisions
  - rollouts
  - sources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - environments/finalizers
  - revisions/finalizers
  - rollouts/finalizers
  - sources/finalizers
  verbs:
  - update
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - environments/status
  - revisions/status
  - rollouts/status
  - sources/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmcharts
  - helmrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmcharts/status
  - helmrepositories/status
  verbs:
  - get
