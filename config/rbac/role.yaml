---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - promotions
  - sources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - promotions/finalizers
  - sources/finalizers
  verbs:
  - update
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - promotions/status
  - sources/status
  verbs:
  - get
  - patch
  - update
