# This rule is not used by the project greenhouse-promotions itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to promotion.cloudoperators.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: greenhouse-promotions
    app.kubernetes.io/managed-by: kustomize
  name: promotion-source-viewer-role
rules:
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - sources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - sources/status
  verbs:
  - get
