# This rule is not used by the project greenhouse-promotions itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the promotion.cloudoperators.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: greenhouse-promotions
    app.kubernetes.io/managed-by: kustomize
  name: promotion-promotion-editor-role
rules:
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - promotions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - promotion.cloudoperators.dev
  resources:
  - promotions/status
  verbs:
  - get
