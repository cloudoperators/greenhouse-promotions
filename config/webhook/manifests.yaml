---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-promotion-cloudoperators-dev-v1alpha1-revision
  failurePolicy: Fail
  name: vrevision.kb.io
  rules:
  - apiGroups:
    - promotion.cloudoperators.dev
    apiVersions:
    - v1alpha1
    operations:
    - UPDATE
    resources:
    - revisions
  sideEffects: None
