apiVersion: greenhouse.sap/v1alpha1
kind: PluginPreset
metadata:
  name: podinfo-k8s-management
spec:
  clusterSelector:
    matchLabels:
      cluster-type: k8s-management
  plugin:
    pluginDefinitionRef:
      kind: PluginDefinition
      name: podinfo
    displayName: Podinfo Management
    releaseName: podinfo
    releaseNamespace: podinfo
    optionValues:
      - name: replicaCount
        value: 2
      - name: ui.message
        value: "podinfo on k8s-management"
  clusterOptionOverrides:
    - clusterName: mgmt-eu-de-1
      overrides:
        - name: ui.message
          value: "podinfo on mgmt-eu-de-1 (management / eu-de)"
    - clusterName: mgmt-eu-nl-1
      overrides:
        - name: ui.message
          value: "podinfo on mgmt-eu-nl-1 (management / eu-nl)"