apiVersion: greenhouse.sap/v1alpha1
kind: PluginPreset
metadata:
  name: podinfo-k8s-admin
spec:
  clusterSelector:
    matchLabels:
      cluster-type: k8s-admin
  plugin:
    pluginDefinitionRef:
      kind: PluginDefinition
      name: podinfo
    displayName: Podinfo Admin
    releaseName: podinfo
    releaseNamespace: podinfo
    optionValues:
      - name: replicaCount
        value: 1
      - name: ui.message
        value: "podinfo on k8s-admin"
  clusterOptionOverrides:
    - clusterName: f-eu-de-1
      overrides:
        - name: ui.message
          value: "podinfo on f-eu-de-1 (admin / eu-de)"
    - clusterName: f-eu-nl-1
      overrides:
        - name: ui.message
          value: "podinfo on f-eu-nl-1 (admin / eu-nl)"